[package]
name = "inventory"
version = "1.0.0"
edition = "2021"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting", "parsing"] }
ureq = { version = "2", features = ["json"] }

# keep file names and line numbers in release backtraces: they are what an investigation reads
[profile.release]
debug = 1
